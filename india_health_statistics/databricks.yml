# This is a Declarative Automation Bundle definition for india_health_statistics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: india_health_statistics
  uuid: 7a8e15b4-c0be-4a7e-a6ae-92ff26345554

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-8c9c3a5c-8fea.cloud.databricks.com
    variables:
      catalog: india_health_lakehouse
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-8c9c3a5c-8fea.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ujjwalraj822001@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ujjwalraj822001@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: india_health_lakehouse
      schema: prod
    permissions:
      - user_name: ujjwalraj822001@gmail.com
        level: CAN_MANAGE
